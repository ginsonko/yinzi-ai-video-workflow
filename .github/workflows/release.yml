name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      npm_config_msvs_version: '2022'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend-node/package-lock.json
            frontweb/package-lock.json
            desktop/package-lock.json

      - name: Setup Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Test backend
        working-directory: backend-node
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Test frontend
        working-directory: frontweb
        run: node --test test/*.test.js

      - name: Build frontend
        working-directory: frontweb
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Build Windows installer and portable package
        working-directory: desktop
        run: npm run dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.yml
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify native runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend-node/package-lock.json
            frontweb/package-lock.json
            desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare native media tools
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-mac-resources.js "${{ matrix.arch }}"
          MEDIA_DIR="$PWD/mac-resources/${{ matrix.arch }}/ffmpeg"
          test -x "$MEDIA_DIR/ffmpeg"
          test -x "$MEDIA_DIR/ffprobe"
          echo "$MEDIA_DIR" >> "$GITHUB_PATH"
          echo "FFMPEG_PATH=$MEDIA_DIR/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$MEDIA_DIR/ffprobe" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Test backend
        working-directory: backend-node
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Test frontend
        working-directory: frontweb
        run: node --test test/*.test.js

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Build native DMG and ZIP
        working-directory: desktop
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Verify native macOS artifacts
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DMG="release-mac/银子AI视频工作流-${VERSION}-mac-${{ matrix.arch }}.dmg"
          ZIP="release-mac/银子AI视频工作流-${VERSION}-mac-${{ matrix.arch }}.zip"
          test -s "$DMG"
          test -s "$ZIP"
          hdiutil verify "$DMG"
          VERIFY_DIR=$(mktemp -d)
          ditto -x -k "$ZIP" "$VERIFY_DIR"
          APP=$(find "$VERIFY_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          MAIN="$APP/Contents/MacOS/银子AI视频工作流"
          test -x "$MAIN"
          test "$(lipo -archs "$MAIN")" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          test -f "$APP/Contents/Resources/app.asar"
          test -x "$APP/Contents/Resources/ffmpeg/ffmpeg"
          test -x "$APP/Contents/Resources/ffmpeg/ffprobe"
          "$APP/Contents/Resources/ffmpeg/ffmpeg" -hide_banner -version
          "$APP/Contents/Resources/ffmpeg/ffprobe" -hide_banner -version
          SQLITE=$(find "$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3" \
            \( -name "darwin-${{ matrix.arch }}.node" -o -name 'better_sqlite3.node' \) \
            -type f -print -quit)
          SHARP=$(find "$APP/Contents/Resources/app.asar.unpacked" -name 'sharp-*.node' -print -quit)
          test -n "$SQLITE"
          test -n "$SHARP"
          test "$(lipo -archs "$SQLITE")" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          test "$(lipo -archs "$SHARP")" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          if [ -n "${CSC_LINK:-}" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
          else
            echo 'Unsigned internal build: codesign/notarization acceptance intentionally pending.'
          fi

      - name: Write SHA-256 manifest
        working-directory: desktop/release-mac
        shell: bash
        run: shasum -a 256 * > SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            desktop/release-mac/*.dmg
            desktop/release-mac/*.zip
            desktop/release-mac/*.json
            desktop/release-mac/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create combined SHA-256 manifest
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
