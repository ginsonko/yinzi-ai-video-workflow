name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      npm_config_msvs_version: '2022'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend-node/package-lock.json
            frontweb/package-lock.json
            desktop/package-lock.json

      - name: Setup Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Test backend
        working-directory: backend-node
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Test frontend
        working-directory: frontweb
        run: node --test test/*.test.js

      - name: Build frontend
        working-directory: frontweb
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Build Windows installer and portable package
        working-directory: desktop
        run: npm run dist:universal

      - name: Normalize Windows artifact names
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $release = Join-Path $PWD 'release-universal'
          $targets = @{
            'Portable' = "银子AI视频工作流-通用版-老李兼容-Portable-$version-x64.exe"
            'Setup' = "银子AI视频工作流-通用版-老李兼容-Setup-$version-x64.exe"
          }
          foreach ($kind in $targets.Keys) {
            $destination = Join-Path $release $targets[$kind]
            if (Test-Path -LiteralPath $destination) { continue }
            $candidate = Get-ChildItem -LiteralPath $release -Filter "*$kind-$version-x64.exe" -File |
              Where-Object { $_.Name -ne $targets[$kind] } | Select-Object -First 1
            if (-not $candidate) { throw "Windows $kind artifact not found in $release" }
            Move-Item -LiteralPath $candidate.FullName -Destination $destination
          }
          if (-not (Test-Path -LiteralPath (Join-Path $release $targets['Portable']))) { throw 'Portable artifact rename failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $release $targets['Setup']))) { throw 'Setup artifact rename failed' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            desktop/release-universal/*-Setup-*.exe
            desktop/release-universal/*-Portable-*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      AI_VIDEO_MAC_VARIANT: universal
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify native runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend-node/package-lock.json
            frontweb/package-lock.json
            desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare native media tools
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-mac-resources.js "${{ matrix.arch }}"
          MEDIA_DIR="$PWD/mac-resources/${{ matrix.arch }}/ffmpeg"
          test -x "$MEDIA_DIR/ffmpeg"
          test -x "$MEDIA_DIR/ffprobe"
          echo "$MEDIA_DIR" >> "$GITHUB_PATH"
          echo "FFMPEG_PATH=$MEDIA_DIR/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$MEDIA_DIR/ffprobe" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Test backend
        working-directory: backend-node
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Test frontend
        working-directory: frontweb
        run: node --test test/*.test.js

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Build native DMG and ZIP
        working-directory: desktop
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Normalize macOS artifact names
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME='银子AI视频工作流-通用版-老李兼容'
          RELEASE_DIR='release-mac-universal'
          for EXT in dmg zip; do
            TARGET="${RELEASE_DIR}/${PRODUCT_NAME}-${VERSION}-mac-${{ matrix.arch }}.${EXT}"
            if [ -f "$TARGET" ]; then continue; fi
            CANDIDATE=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.${EXT}" -print -quit)
            test -n "$CANDIDATE"
            mv "$CANDIDATE" "$TARGET"
          done
          test -s "${RELEASE_DIR}/${PRODUCT_NAME}-${VERSION}-mac-${{ matrix.arch }}.dmg"
          test -s "${RELEASE_DIR}/${PRODUCT_NAME}-${VERSION}-mac-${{ matrix.arch }}.zip"

      - name: Verify native macOS artifacts
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME='银子AI视频工作流-通用版-老李兼容'
          APP_ID='top.yinziapi.ai-video-workflow.universal'
          DMG="release-mac-universal/${PRODUCT_NAME}-${VERSION}-mac-${{ matrix.arch }}.dmg"
          ZIP="release-mac-universal/${PRODUCT_NAME}-${VERSION}-mac-${{ matrix.arch }}.zip"
          test -s "$DMG"
          test -s "$ZIP"
          hdiutil verify "$DMG"
          VERIFY_DIR=$(mktemp -d)
          ditto -x -k "$ZIP" "$VERIFY_DIR"
          APP=$(find "$VERIFY_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          MAIN="$APP/Contents/MacOS/${PRODUCT_NAME}"
          test -x "$MAIN"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "$APP_ID"
          test "$(lipo -archs "$MAIN")" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          test -f "$APP/Contents/Resources/app.asar"
          test -x "$APP/Contents/Resources/ffmpeg/ffmpeg"
          test -x "$APP/Contents/Resources/ffmpeg/ffprobe"
          "$APP/Contents/Resources/ffmpeg/ffmpeg" -hide_banner -version
          "$APP/Contents/Resources/ffmpeg/ffprobe" -hide_banner -version
          SQLITE=$(find "$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3" \
            \( -name "darwin-${{ matrix.arch }}.node" -o -name 'better_sqlite3.node' \) \
            -type f -print -quit)
          SHARP=$(find "$APP/Contents/Resources/app.asar.unpacked" -name 'sharp-*.node' -print -quit)
          test -n "$SQLITE"
          test -n "$SHARP"
          test "$(lipo -archs "$SQLITE")" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          test "$(lipo -archs "$SHARP")" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          if [ -n "${CSC_LINK:-}" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
          else
            echo 'Unsigned internal build: codesign/notarization acceptance intentionally pending.'
          fi

      - name: Write SHA-256 manifest
        working-directory: desktop/release-mac-universal
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('../package.json').version")
          ARCH="${{ matrix.arch }}"
          PRODUCT_NAME='银子AI视频工作流-通用版-老李兼容'
          DMG="${PRODUCT_NAME}-${VERSION}-mac-${ARCH}.dmg"
          ZIP="${PRODUCT_NAME}-${VERSION}-mac-${ARCH}.zip"
          RECEIPT="native-mac-build-${ARCH}.json"
          shasum -a 256 "$DMG" "$ZIP" "$RECEIPT" > "SHA256SUMS-${ARCH}.txt"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            desktop/release-mac-universal/*.dmg
            desktop/release-mac-universal/*.zip
            desktop/release-mac-universal/native-mac-build-${{ matrix.arch }}.json
            desktop/release-mac-universal/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create combined SHA-256 manifest
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: .github/RELEASE_NOTES_v0.1.3-beta.7.md
          generate_release_notes: false
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
